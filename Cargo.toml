[package]
name = "proxy-client"
version = "3.0.2"
edition = "2021"
rust-version = "1.88"

[profile.release]
lto = "thin"
strip = true

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
futures-util = { version = "0.3.32", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "rustls-no-provider", "stream"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
sentry = { version = "0.48.5", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
uuid = { version = "1.23.5", features = ["v4"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["form", "http1", "tokio", "ws"] }
tower = { version = "0.5.3", features = ["util"] }
